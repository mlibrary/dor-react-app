services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    command:
      - "sleep"
      - "infinity"
    depends_on:
      - search-parser

  search-parser:
    build:
      context: ./search-parser-service
      dockerfile: Dockerfile
    ports:
      - "4567:4567"
    volumes:
      - ./search-parser-service:/app
    restart: unless-stopped
