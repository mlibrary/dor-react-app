---
name: "Build Search Parser Service Image"

on:
  push:
    paths:
      - "search-parser-service/**"
      - ".github/workflows/build-search-parser-service-image.yaml"
  pull_request:
    paths:
      - "search-parser-service/**"
      - ".github/workflows/build-search-parser-service-image.yaml"
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI

jobs:
  build:
    name: "Build Docker image"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and push to GitHub Container Registry
        uses: docker/build-push-action@v6
        with:
          context: ./search-parser-service
          file: ./search-parser-service/Dockerfile
          # Push on every merge to main and on workflow_dispatch, but not on PRs.
          push: ${{ github.event_name != 'pull_request' }}
          tags: 'ghcr.io/mlibrary/dor-react-app/search-parser-service:${{ github.sha }}'
          # Pass the same build args that the Dockerfile accepts.
          # Defaults match the Dockerfile ARG defaults so the build works
          # out-of-the-box; override via repository/environment secrets if needed.
          build-args: |
            MLIBRARY_SEARCH_PARSER_GIT=${{ vars.MLIBRARY_SEARCH_PARSER_GIT || 'https://github.com/mlibrary/mlibrary_search_parser.git' }}
            MLIBRARY_SEARCH_PARSER_REF=${{ vars.MLIBRARY_SEARCH_PARSER_REF || 'DOR-159/opensearch-query-dsl' }}
